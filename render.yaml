services:
  - type: web
    name: a2a-marketing-agents
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      - key: A2A_BASE_URL
        value: https://a2a-marketing-agents.onrender.com